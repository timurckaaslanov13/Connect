limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /healthz { access_log off; return 200 'ok'; }
    location ~ ^/api/chats/(internal|[0-9]+/members) { return 404; }
    location /api/auth { limit_req zone=auth_limit burst=15 nodelay; proxy_pass http://auth-service:8000/auth; }
    location /api/users { proxy_pass http://user-service:8000/users; }
    location /api/friends { proxy_pass http://user-service:8000/friends; }
    location /api/chats { proxy_pass http://chat-service:8000/chats; }
    location /api/messages { proxy_pass http://message-service:8000/messages; }
    location /api/calls { proxy_pass http://message-service:8000/calls; }
    location /ws/ {
        proxy_pass http://message-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
