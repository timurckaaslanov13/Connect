services:
  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "127.0.0.1:${AUTH_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://auth_user:auth_password@auth-db:5432/auth_db
      JWT_SECRET_KEY: "super-secret-key-change-me"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  user-service:
    build:
      context: ./services/user-service
    ports:
      - "127.0.0.1:${USER_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://user_user:user_password@user-db:5432/user_db
