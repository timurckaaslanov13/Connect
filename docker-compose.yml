      DATABASE_URL: postgresql+psycopg://user_user:${USER_DB_PASSWORD:?Set database password in .env}@user-db:5432/user_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run python scripts/init_env.py}
      JWT_ALGORITHM: "HS256"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      user-db:
        condition: service_healthy

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set database password in .env}
    ports:
      - "127.0.0.1:${USER_DB_PORT:-5433}:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  chat-service:
    build:
      context: ./services/chat-service
    ports:
      - "127.0.0.1:${CHAT_PORT:-8002}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://chat_user:${CHAT_DB_PASSWORD:?Set database password in .env}@chat-db:5432/chat_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run python scripts/init_env.py}
      JWT_ALGORITHM: "HS256"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set internal API key in .env}
      USER_SERVICE_URL: http://user-service:8000
    healthcheck:
