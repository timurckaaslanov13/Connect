      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      user-db:
        condition: service_healthy

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_password
    ports:
      - "127.0.0.1:${USER_DB_PORT:-5433}:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  chat-service:
    build:
