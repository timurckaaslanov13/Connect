<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Connect WebSocket Test</title>
</head>
<body>
    <h1>WebSocket test</h1>

    <input
        id="token"
        type="password"
        placeholder="JWT token"
        style="width: 800px;"
    >

    <br><br>

    <input id="server-url" type="url" value="ws://127.0.0.1:8003" aria-label="WebSocket server">
    <input id="chat-id" type="number" min="1" placeholder="ID чата">

    <input
        id="message"
        type="text"
        placeholder="Сообщение"
    >

    <button onclick="connect()">Подключиться</button>
    <button onclick="sendMessage()">Отправить</button>

    <pre id="log"></pre>

    <script>
        let ws;
        let authenticated = false;

        function log(message) {
            document.getElementById("log").textContent += message + "\n";
        }

        function connect() {
            const token = document.getElementById("token").value;
            const serverUrl = document.getElementById("server-url").value.replace(/\/$/, "");
            const chatId = Number(document.getElementById("chat-id").value);

            if (!token || !Number.isInteger(chatId) || chatId < 1) {
                log("Укажи JWT token и ID чата");
                return;
            }

            if (ws) ws.close();
            authenticated = false;

            ws = new WebSocket(
                `${serverUrl}/ws/chats/${chatId}`
            );

            const socket = ws;
            ws.onopen = () => {
                socket.send(JSON.stringify({type: 'auth', token}));
                log("✅ WebSocket подключен");
            };

            ws.onmessage = (event) => {
                if (socket !== ws) return;
                const data = JSON.parse(event.data);
                if (data.type === 'ready') authenticated = true;
                log("📩 " + event.data);
            };

            ws.onclose = (event) => {
                if (socket !== ws) return;
                authenticated = false;
                log(`❌ Закрыт. Код: ${event.code}`);
            };

            ws.onerror = () => {
                log("⚠️ WebSocket ошибка");
            };
        }

        function sendMessage() {
            const message = document.getElementById("message").value;

            if (!ws || ws.readyState !== WebSocket.OPEN || !authenticated) {
                log("Сначала подключись");
                return;
            }

            ws.send(message);
        }
    </script>
</body>
</html>
